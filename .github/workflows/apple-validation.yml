name: Apple validation
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Validation target
        type: choice
        options: ['1', '2']
        default: '1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ inputs.phase == '2' && 'xcode-27' || 'macos-26' }}
    timeout-minutes: ${{ inputs.phase == '2' && 120 || 45 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Metal Toolchain for Phase 2
        if: inputs.phase == '2'
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Set up Python 3.11 for required separator conversion
        if: inputs.phase == '2'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare and verify required bundled live diarizer
        if: inputs.phase == '2'
        run: bash Tools/prepare-diarizer-macos.sh
      - name: Prepare and verify required bundled separator VAD
        if: inputs.phase == '2'
        run: bash Tools/prepare-vad-macos.sh
      - name: Prepare and verify required two-speaker separator
        if: inputs.phase == '2'
        run: bash Tools/prepare-separator-macos.sh
      - name: Compile and run native regression tests
        run: bash Tools/test-apple.sh '${{ inputs.phase }}'
      - name: Preserve diagnostics and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-validation-phase-${{ inputs.phase }}
          path: |
            BuildOutputs/**/toolchain.txt
            BuildOutputs/**/source-SHA256SUMS.txt
            BuildOutputs/**/source-SHA256SUMS.original.txt
            BuildOutputs/**/simulators.json
            BuildOutputs/**/*.log
            BuildOutputs/**/*.xcresult
            BuildOutputs/**/Package.resolved
            BuildOutputs/**/*.ipa
            BuildOutputs/**/*.ipa.sha256
            BuildOutputs/**/PASS.txt
            BuildOutputs/Separation/asset-manifest.json
            BuildOutputs/Separation/conversion-report.json
            BuildOutputs/Separation/licenses/**
            BuildOutputs/Diarization/asset-manifest.json
            BuildOutputs/Diarization/source.json
            BuildOutputs/Diarization/licenses/**
            BuildOutputs/VAD/asset-manifest.json
            BuildOutputs/VAD/source.json
            BuildOutputs/VAD/licenses/**
          if-no-files-found: warn
